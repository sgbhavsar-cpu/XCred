org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# Kotlin's incremental compiler computes relative paths between the project and Gradle
# caches; on Windows that throws ("this and base files have different roots") whenever
# the project (here, E:\) and the pub/Gradle caches (C:\) are on different drive letters.
# Disabling incremental compilation avoids it entirely — full recompiles are slower but
# correct, which is what a CI-less local Windows dev setup needs.
kotlin.incremental=false
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
