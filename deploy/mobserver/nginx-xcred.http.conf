# --- XCred rate limit: http-level part. Put at the TOP of XContactMgr's nginx.conf, above `server {` ---
# (conf.d/*.conf is included inside nginx's http{} block, so these directives are valid there.)
#
# Only login / register / refresh get a (non-empty) key; every other URL maps to "" and is never limited.
# 30 requests per minute per client address, plus a burst of 20 (see `limit_req` in the /xcred/ location).
# NOTE: Docker Desktop for Windows rewrites every client's address to the Docker gateway (172.19.0.1) before
# nginx sees it, so today this behaves as ONE shared limit for all users rather than per-user. It is sized
# generously for that (normal use is a handful of logins a day) and becomes truly per-client automatically
# if nginx ever sees real client addresses (native nginx / host networking).
map $uri $xcred_auth_key {
    default                          "";
    ~^/xcred/api/auth/(login|register|refresh)$  $binary_remote_addr;
}
limit_req_zone $xcred_auth_key zone=xcred_auth:10m rate=30r/m;
