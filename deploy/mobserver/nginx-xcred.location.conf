# --- XCred (credential vault) at /xcred/ -> container "xcred" on this Docker network ---
# Goes inside the `server { ... }` block of XContactMgr's nginx.conf, ABOVE `location / { ... }`.
# (nginx picks the longest matching prefix, so /xcred/ wins over / and /xcontactmgr/ is untouched.)
# Needs the http-level lines from nginx-xcred.http.conf (the rate-limit map + zone) above `server {`.
#
# proxy_pass has a trailing slash on purpose: nginx strips the /xcred/ prefix, so the XCred container
# sees /api/... and /assets/... exactly as it does when it runs at the site root. The SPA itself was
# built with base /xcred/ (docker-compose build arg), so the browser requests /xcred/assets/...

location = /xcred {
    return 301 $scheme://$http_host/xcred/;
}

location /xcred/ {
    # Brute-force / flood throttle for login, register and token refresh only (key is empty -> not limited
    # for every other path, see the map in nginx-xcred.http.conf). Over the limit -> HTTP 429.
    limit_req          zone=xcred_auth burst=20 nodelay;
    limit_req_status   429;

    # Security headers (re-sent on every response, including errors, via "always").
    add_header X-Content-Type-Options    "nosniff" always;
    add_header X-Frame-Options           "DENY" always;
    add_header Referrer-Policy           "no-referrer" always;
    add_header Permissions-Policy        "camera=(), microphone=(), geolocation=(), payment=(), usb=(), interest-cohort=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;
    # The SPA loads nothing from other origins (scripts, styles, fonts, images and API are all same-origin).
    # 'unsafe-inline' for styles only: React sets per-element style attributes (tag colours etc.).
    add_header Content-Security-Policy   "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
    # HSTS is deliberately NOT enabled: browsers apply it to the whole host name (every port), and it can't be
    # undone for max-age. Once you're sure nothing else on mobserver.ssm-infotech.com needs plain HTTP, add:
    # add_header Strict-Transport-Security "max-age=31536000" always;

    proxy_pass         http://xcred:8080/;
    proxy_http_version 1.1;
    proxy_set_header   Host $http_host;
    proxy_set_header   X-Real-IP $remote_addr;
    # Replace (don't append to) X-Forwarded-For: nginx is the edge, so a client-supplied value must not pass through.
    proxy_set_header   X-Forwarded-For $remote_addr;
    proxy_set_header   X-Forwarded-Proto $scheme;
    proxy_read_timeout 300s;
    proxy_connect_timeout 75s;
}
