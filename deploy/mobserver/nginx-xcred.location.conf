# Paste inside the `server { ... }` block of XContactMgr's nginx.conf, ABOVE `location / { ... }`.
# (nginx picks the longest matching prefix, so /xcred/ wins over / and /xcontactmgr/ is untouched.)
#
# proxy_pass has a trailing slash on purpose: nginx strips the /xcred/ prefix, so the XCred container
# sees /api/... and /assets/... exactly as it does when it runs at the site root. The SPA itself was
# built with base /xcred/ (docker-compose build arg), so the browser asks for /xcred/assets/... etc.

location = /xcred {
    return 301 $scheme://$http_host/xcred/;
}

location /xcred/ {
    proxy_pass         http://xcred:8080/;
    proxy_http_version 1.1;
    proxy_set_header   Host $http_host;
    proxy_set_header   X-Real-IP $remote_addr;
    proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header   X-Forwarded-Proto $scheme;
    proxy_read_timeout 300s;
    proxy_connect_timeout 75s;
}
